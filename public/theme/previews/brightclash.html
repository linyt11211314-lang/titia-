<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=280,height=200">
<title>明亮撞色 预览</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:#e8e8e8; font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif; }
  .card {
    width:260px; height:190px; border-radius:18px; overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.12);
    display:flex; flex-direction:column;
    background:#fefefa;
  }
  .card-header {
    padding:12px 16px 6px;
    display:flex; align-items:center; gap:8px;
  }
  .dots { display:flex; gap:4px }
  .dot { width:10px; height:10px; border-radius:50%; }
  .title { color:#1f1e16; font-size:13px; font-weight:600; letter-spacing:.5px; }
  .card-body {
    flex:1; padding:0 16px 12px;
    display:flex; flex-direction:column; gap:8px;
  }
  .tricolor {
    display:flex; gap:0; border-radius:12px; overflow:hidden; height:44px;
  }
  .tri { flex:1; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; }
  .sub-row { display:flex; gap:6px; }
  .mini-swatch {
    height:24px; border-radius:6px; flex:1;
    display:flex; align-items:center; justify-content:center;
    font-size:9px; font-weight:600;
  }
  .tags { display:flex; gap:6px; align-items:center }
  .tag {
    display:inline-block; padding:3px 10px; border-radius:20px;
    font-size:10px; font-weight:600;
  }
  .bar { height:5px; width:100%; border-radius:3px }
</style>
</head>
<body>
<div class="card">
  <div class="card-header">
    <span class="dots">
      <span class="dot" style="background:#FCDF35"></span>
      <span class="dot" style="background:#87CC62"></span>
      <span class="dot" style="background:#FC6BAD"></span>
    </span>
    <span class="title">明亮撞色 · BRIGHT CLASH</span>
  </div>
  <div class="card-body">
    <div class="tricolor">
      <div class="tri" style="background:#FCDF35;color:#6b6a52">明亮黄<br>#FCDF35</div>
      <div class="tri" style="background:#87CC62;color:#1f1e16">青草绿<br>#87CC62</div>
      <div class="tri" style="background:#FC6BAD;color:#fff">亮粉色<br>#FC6BAD</div>
    </div>
    <div class="sub-row">
      <div class="mini-swatch" style="background:#fcf8d8;color:#6b6a52">primary-soft</div>
      <div class="mini-swatch" style="background:#ecf5e6;color:#6b6a52">accent-soft</div>
      <div class="mini-swatch" style="background:#fce8f4;color:#6b6a52">highlight-soft</div>
    </div>
    <div class="tags">
      <span class="tag" style="background:#FCDF35;color:#1f1e16">浅色/节日风</span>
      <span style="font-size:9px;color:#96947a">三色搭配 · 撞色系</span>
    </div>
    <div class="bar" style="background:linear-gradient(90deg,#FCDF35 0%,#87CC62 33%,#FC6BAD 66%,#FCDF35 100%)"></div>
  </div>
</div>
</body>
</html>
